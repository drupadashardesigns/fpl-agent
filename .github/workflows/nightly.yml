name: Nightly snapshot

on:
  schedule:
    - cron: "45 1 * * *"   # 01:45 UTC, after the 00:00 UK price update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Archive bootstrap and fixtures
        run: python -m engine snapshot
      # Once a night, up to 3 attempts. Understat has been down for everyone
      # since about 2 Nov 2026. A failure is recorded in data/sources.json and
      # the command exits 0; continue-on-error is a second guard, so this step
      # never fails the job.
      - name: Understat (league + new finished matches)
        id: understat
        continue-on-error: true
        run: python -m engine understat
      # FotMob: league file, the stat tables, then matchDetails and heatmaps only
      # for finished matches not yet stored (one request every 2 seconds). Same
      # rule as Understat: a failure is recorded and never fails the job.
      - name: FotMob (league, stat tables, new finished matches)
        id: fotmob
        continue-on-error: true
        run: python -m engine fotmob
      - name: Rebuild the app bundle with the new data
        run: |
          if ls data/runs/gw*/facts.json >/dev/null 2>&1; then python -m engine appdata; fi
      - name: Commit snapshot
        run: |
          git config user.name "fpl-agent-bot"
          git config user.email "fpl-agent-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Nightly snapshot $(date -u +%F)"
            git push
          fi
