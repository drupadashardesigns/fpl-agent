name: Nightly snapshot

on:
  schedule:
    - cron: "45 1 * * *"   # 01:45 UTC, after the 00:00 UK price update
  workflow_dispatch:
  push:  # TEMPORARY: first Understat run from the feature branch; removed before merge
    branches: [claude/wonderful-cannon-vsib38]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Archive bootstrap and fixtures
        run: python -m engine snapshot
      # Understat is blocked from Claude's sandbox, so it is fetched here.
      # League data once, then only finished matches not already stored,
      # one request every 3 seconds. A failure is recorded in data/sources.json
      # and the app keeps showing the last good numbers with their date.
      - name: TEMPORARY Understat reachability probe
        continue-on-error: true
        run: |
          getent ahosts understat.com | head -4 || true
          for u in https://understat.com/ https://understat.com/getLeagueData/EPL/2026; do
            curl -sS -4 -o /tmp/out -m 25 -w "$u -> %{http_code} %{size_download}B %{time_total}s ip=%{remote_ip}\n" \
              -H 'X-Requested-With: XMLHttpRequest' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' "$u" || echo "$u failed"
            head -c 200 /tmp/out 2>/dev/null; echo
          done
      - name: Understat (league + new finished matches)
        id: understat
        continue-on-error: true
        run: python -m engine understat
      - name: Rebuild the app bundle with the new data
        run: |
          if ls data/runs/gw*/facts.json >/dev/null 2>&1; then python -m engine appdata; fi
      - name: Commit snapshot
        run: |
          git config user.name "fpl-agent-bot"
          git config user.email "fpl-agent-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Nightly snapshot $(date -u +%F)"
            git push
          fi
