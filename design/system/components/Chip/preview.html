<!-- @dsCard group="Labels" height=150 subtitle="Story tags and pills" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap">
<div style="display:flex;flex-direction:column;gap:14px;padding:20px;background:var(--surface);font-family:var(--font-text);">
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <span class="label-strong" style="padding:7px 10px;border-radius:var(--radius-pill);background:var(--green-tint);color:var(--green-ink);">Gameweek 9</span>
    <span class="label-strong" style="padding:7px 10px;border-radius:var(--radius-pill);background:var(--orange-tint);color:var(--orange-tint-ink);">The template</span>
    <span class="label-strong" style="padding:7px 10px;border-radius:var(--radius-pill);background:var(--blue-tint);color:var(--blue-ink);">Fixtures</span>
    <span class="label-strong" style="padding:7px 10px;border-radius:var(--radius-pill);background:var(--red-tint);color:var(--red-ink);">Injury</span>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <span class="pill" style="font-weight:700;padding:10px 14px;border-radius:var(--radius-pill);background:var(--orange);color:var(--on-orange);">Captain Haaland</span>
    <span class="pill" style="padding:10px 14px;border-radius:var(--radius-pill);background:var(--surface-sunken);color:var(--ink);">Vice Gabriel</span>
    <span class="pill" style="padding:10px 14px;border-radius:var(--radius-pill);background:var(--surface-sunken);color:var(--ink);">£2.1m left</span>
  </div>
</div>
