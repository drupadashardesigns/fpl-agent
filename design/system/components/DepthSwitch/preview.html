<!-- @dsCard group="Actions" height=140 subtitle="Headline, the read, data room" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap">
<div style="padding:20px;background:var(--surface);font-family:var(--font-text);max-width:390px;box-sizing:border-box;">
  <div id="sw" role="group" aria-label="How deep" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:var(--radius-md);background:var(--surface-sunken);">
    <button type="button" data-i="0">Headline</button>
    <button type="button" data-i="1">The read</button>
    <button type="button" data-i="2">Data room</button>
  </div>
  <p id="out" class="label" style="margin:12px 0 0;color:var(--ink-subtle);"></p>
</div>
<script>
(function () {
  var btns = document.querySelectorAll('#sw button');
  var notes = ['Headline and paragraph only.', 'The read opens under the paragraph.', 'The read plus the data room open.'];
  function set(i) {
    btns.forEach(function (b, j) {
      var on = j === i;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.className = on ? 'label-strong' : 'label';
      b.style.cssText = 'min-height:40px;border:0;border-radius:var(--radius-sm);cursor:pointer;font-family:var(--font-text);' +
        (on ? 'background:var(--ink);color:#FFFFFF;' : 'background:transparent;color:var(--ink-subtle);');
    });
    document.getElementById('out').textContent = notes[i];
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { set(+b.dataset.i); }); });
  set(1);
})();
</script>
