<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap">
<div style="padding:20px;background:var(--ground);font-family:var(--font-text);max-width:390px;box-sizing:border-box;">
  <article style="padding:18px;border-radius:var(--radius-lg);background:var(--surface);display:flex;flex-direction:column;gap:10px;color:var(--ink);">
    <span class="label-strong" style="align-self:flex-start;padding:7px 10px;border-radius:var(--radius-pill);background:var(--orange-tint);color:var(--orange-tint-ink);">The template</span>
    <h3 class="headline" style="margin:0;font-family:var(--font-display);">Rogers is in 90% of top 10k teams</h3>
    <p class="body" style="margin:0;color:var(--ink-muted);">You are one of the few without him. He is first in line for GW11, when he costs a free transfer instead of a hit.</p>
    <p class="body" style="margin:0;padding-top:12px;border-top:1px solid var(--line);">Rogers is owned by 83% of managers around your rank, so every Rogers return moves them and not you.</p>
    <div role="group" aria-label="How deep" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:var(--radius-md);background:var(--surface-sunken);">
      <button type="button" class="label" aria-pressed="false" style="min-height:40px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--ink-subtle);font-family:var(--font-text);">Headline</button>
      <button type="button" class="label-strong" aria-pressed="true" style="min-height:40px;border:0;border-radius:var(--radius-sm);background:var(--ink);color:#FFFFFF;font-family:var(--font-text);">The read</button>
      <button type="button" class="label" aria-pressed="false" style="min-height:40px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--ink-subtle);font-family:var(--font-text);">Data room</button>
    </div>
  </article>
</div>
