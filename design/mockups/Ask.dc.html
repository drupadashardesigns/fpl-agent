<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask the agent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #1747B8;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #F2F5FB; color: #0F1A3D; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; font-size: 16px; line-height: 1.6; display: flex; flex-direction: column;">

  <header style="padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font: 800 28px/1.2 'Plus Jakarta Sans', sans-serif;">Ask the agent</h1>
    <p style="margin: 0; color: #36426A;">Answers come from this week's data and your squad.</p>
  </header>

  <section style="padding: 0 20px 16px; display: flex; gap: 8px; flex-wrap: wrap;">
    <sc-for list="{{qs}}" as="q" hint-placeholder-count="3">
      <button type="button" onClick="{{q.pick}}" aria-pressed="{{q.on}}" style="{{q.style}}">{{q.short}}</button>
    </sc-for>
  </section>

  <section style="padding: 0 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="align-self: flex-end; max-width: 85%; padding: 12px 16px; border-radius: 18px 18px 4px 18px; background: #0F1A3D; color: #F3F5FB;">{{cur.q}}</div>
    <div style="max-width: 92%; padding: 16px; border-radius: 18px 18px 18px 4px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px;">
      <p style="margin: 0; font: 700 18px/1.4 'Plus Jakarta Sans', sans-serif;">{{cur.lead}}</p>
      <p style="margin: 0; color: #36426A;">{{cur.body}}</p>
      <span style="font-size: 14px; color: #4A5578; padding-top: 8px; border-top: 1px solid #E1E6F2;">From: {{cur.src}}</span>
      <sc-if value="{{cur.hasEvidence}}" hint-placeholder-val="{{true}}"><a href="DataRoom.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; font: 700 15px/1.3 'Atkinson Hyperlegible Next', sans-serif; color: #1747B8;">See the evidence →</a></sc-if>
    </div>
  </section>

  <form style="margin: auto 20px 12px; padding: 8px; border-radius: 18px; background: #FFFFFF; display: flex; gap: 8px; align-items: center;">
    <label for="ask-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Your question</label>
    <input id="ask-input" type="text" value="{{draft}}" onChange="{{onDraft}}" aria-describedby="ask-error" placeholder="Ask about a player, fixture or plan" style="flex: 1; min-width: 0; min-height: 46px; border: 0; padding: 0 10px; background: transparent; color: #0F1A3D; font-size: 16px;">
    <button type="button" onClick="{{send}}" style="min-height: 46px; padding: 0 18px; border: 0; border-radius: 12px; background: #FF8A2B; color: #1A1208; font: 700 16px/1 'Plus Jakarta Sans', sans-serif;">Ask</button>
  </form>
  <p id="ask-error" style="margin: 0 20px 12px; min-height: 20px; font-size: 14px; color: #8A1C14;">{{errText}}</p>

  <nav aria-label="Main" style="margin: 0 12px 12px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px; border-radius: 22px; background: #0F1A3D;">
    <a href="Day.dc.html" style="min-height: 50px; display: flex; align-items: center; justify-content: center; font: 500 14px/1 'Atkinson Hyperlegible Next', sans-serif; color: #C3CCE6; text-decoration: none;">Edition</a>
    <a href="Squad.dc.html" style="min-height: 50px; display: flex; align-items: center; justify-content: center; font: 500 14px/1 'Atkinson Hyperlegible Next', sans-serif; color: #C3CCE6; text-decoration: none;">Squad</a>
    <a href="Planner.dc.html" style="min-height: 50px; display: flex; align-items: center; justify-content: center; font: 500 14px/1 'Atkinson Hyperlegible Next', sans-serif; color: #C3CCE6; text-decoration: none;">Planner</a>
    <a href="Ask.dc.html" aria-current="page" style="min-height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font: 700 14px/1 'Atkinson Hyperlegible Next', sans-serif; color: #1A1208; background: #FF8A2B; text-decoration: none;">Ask</a>
    <a href="Alerts.dc.html" style="min-height: 50px; display: flex; align-items: center; justify-content: center; font: 500 14px/1 'Atkinson Hyperlegible Next', sans-serif; color: #C3CCE6; text-decoration: none;">Alerts</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: 'cap', draft: '', err: false, custom: null }; }
  renderVals() {
    const all = [
      { id: 'cap', short: 'Captain Gabriel?', q: 'Should I captain Gabriel over Haaland this week?',
        lead: 'Keep the armband on Haaland.',
        body: 'The model has Gabriel at 5.8 and Haaland at 4.7 for GW10, but it underrates premium forwards. 88% of the top 10k captain Haaland, so if he hauls and you went elsewhere, you lose ground on almost everyone near you.',
        src: 'GW10 projections, 600 sampled top 10k teams' },
      { id: 'barry', short: 'Keep Barry?', q: 'Is Barry a keeper or a sell?',
        lead: 'Keep him. He is one of your best differentials.',
        body: 'Barry projects 28.6 points over the next six gameweeks, second among forwards behind Haaland. Only 22% of the top 10k own him, so his returns gain you ground.',
        src: 'GW10 to GW15 projections, 600 sampled top 10k teams' },
      { id: 'wc', short: 'Next Wildcard?', q: 'When should I play my second Wildcard?',
        lead: 'Most likely just before the second-half doubles.',
        body: 'Your second Wildcard unlocks at GW20. Blanks and doubles are forecast for GW30, GW32, GW33 and GW35 or 36. Playing it around GW31 builds the squad for those weeks. We will firm this up once the cup draws set the doubles.',
        src: '2026/27 rules, blank and double gameweek forecast' }
    ];
    const picked = { ...all.find((x) => x.id === this.state.q), hasEvidence: true };
    const cur = this.state.custom ? { q: this.state.custom, lead: 'This is where your own answer appears.', body: 'In the app, your question is answered from this week’s data and your squad. In this mockup, tap a suggested question above to see a real answer.', src: 'mockup', hasEvidence: false } : picked;
    const send = () => { const t = this.state.draft.trim(); if (!t) { this.setState({ err: true }); return; } this.setState({ custom: t, draft: '', err: false }); };
    const on = "min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #0F1A3D; color: #FFFFFF; font: 700 15px/1 'Atkinson Hyperlegible Next', sans-serif;";
    const off = "min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFFFFF; color: #0F1A3D; font: 500 15px/1 'Atkinson Hyperlegible Next', sans-serif;";
    const active = !this.state.custom;
    return { cur, send, draft: this.state.draft, errText: this.state.err ? 'Type a question first.' : '',
      onDraft: (e) => this.setState({ draft: e.target.value, err: false }),
      qs: all.map((x) => ({ ...x, on: active && x.id === this.state.q, style: active && x.id === this.state.q ? on : off, pick: () => this.setState({ q: x.id, custom: null }) })) };
  }
}
</script>
</body>
</html>
